name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: repository-quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install quality dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash clang-format pre-commit python3-flake8 ripgrep
      - name: Check shell syntax
        run: |
          mapfile -t shell_files < <(find scripts -type f -name '*.sh' -print)
          bash -n "${shell_files[@]}"
      - name: Run flake8
        run: flake8 --exclude '_output,build,logs,log' .
      - name: Run pre-commit
        run: pre-commit run --all-files
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            build_type: Debug
            cmake_options: ""
            test_regex: ""
            test_label_exclude: ""
          - name: release
            build_type: Release
            cmake_options: ""
            test_regex: ""
            test_label_exclude: ""
          - name: asan-ubsan
            build_type: Debug
            cmake_options: "-DCOCKPIT_ENABLE_ASAN_UBSAN=ON"
            test_regex: ""
            test_label_exclude: "system-grpc"
          - name: tsan-camera
            build_type: Debug
            cmake_options: "-DCOCKPIT_ENABLE_TSAN=ON"
            # GCC 11 TSan mis-tracks mutex ownership after the monitor thread calls
            # posix_spawn. The real process lifecycle test remains in Debug, Release,
            # and ASan/UBSan; this job stays focused on in-process thread concurrency.
            test_regex: "^(camera_service_test|camera_synthetic_stability_test|audio_capture_stream_test|audio_capture_controller_test|speech_pipeline_test|voice_interaction_service_test|async_voice_response_sink_test|audio_playback_test|audio_playback_client_test|app_launcher_model_test|media_control_model_test|sentinel_service_test)$"
            test_label_exclude: ""

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev
          sudo apt-get install -y \
            build-essential cmake git libasound2-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-good libgstreamer-plugins-base1.0-dev \
            libgrpc++-dev libssl-dev \
            libprotobuf-dev libunwind-dev libxkbcommon-dev libyaml-cpp-dev ninja-build \
            openssl pkg-config protobuf-compiler protobuf-compiler-grpc qt6-base-dev ripgrep \
            qt6-declarative-dev qml6-module-qtqml-workerscript qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window

      - name: Check driver dependency boundaries
        run: scripts/dev/lint.sh --driver-boundaries-only

      - name: Configure and build
        env:
          BUILD_DIR: _output/build/ci-${{ matrix.name }}
        run: |
          scripts/build.sh --arch x86_64 --type "${{ matrix.build_type }}" --no-test -- \
            ${{ matrix.cmake_options }}

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test_args=(
            --test-dir "_output/build/ci-${{ matrix.name }}"
            --output-on-failure
          )
          if [[ -n "${{ matrix.test_regex }}" ]]; then
            test_args+=(-R "${{ matrix.test_regex }}")
          fi
          if [[ -n "${{ matrix.test_label_exclude }}" ]]; then
            test_args+=(-LE "${{ matrix.test_label_exclude }}")
          fi
          ctest "${test_args[@]}"

      - name: Runtime smoke
        if: matrix.name == 'debug'
        env:
          BUILD_DIR: _output/build/ci-debug
        run: scripts/tests/smoke.sh

      - name: Validate signed package
        if: matrix.name == 'release'
        env:
          BUILD_DIR: _output/build/ci-release
        run: |
          openssl genpkey -algorithm ED25519 -out /tmp/cockpit-ota-ci-key.pem
          OTA_SIGNING_KEY=/tmp/cockpit-ota-ci-key.pem scripts/package.sh
  ros2-nav2:
    name: ros2-nav2
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install base build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git libasound2-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-good libgstreamer-plugins-base1.0-dev \
            libgrpc++-dev libprotobuf-dev libssl-dev libunwind-dev libxkbcommon-dev \
            libyaml-cpp-dev ninja-build openssl pkg-config protobuf-compiler \
            protobuf-compiler-grpc qt6-base-dev qt6-declarative-dev ripgrep python3-flake8 \
            qml6-module-qtqml-workerscript qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window
      - name: Install pinned ROS2 Humble/Nav2
        env:
          COCKPIT_SKIP_ROSDEP_SETUP: "1"
        run: bash scripts/setup/ros2/install.sh
      - name: Verify pinned ROS2 packages
        run: bash scripts/setup/ros2/verify.sh
      - name: Configure and build cockpit ROS2 adapter
        env:
          BUILD_DIR: _output/build/ci-ros2
        run: |
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          scripts/build.sh --arch x86_64 --type Debug --no-test -- \
            -DCOCKPIT_ENABLE_ROS2=ON
      - name: Build ROS2 workspace
        run: |
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          bash scripts/ros2/build.sh
      - name: Test ROS2 workspace and official Nav2 smoke
        env:
          BUILD_DIR: _output/build/ci-ros2
          ROS2_OUTPUT_DIR: _output/ros2
        run: |
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          bash scripts/ros2/test.sh
      - name: Test ROS2 CMake integration
        env:
          BUILD_DIR: _output/build/ci-ros2
        run: |
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          ctest --test-dir _output/build/ci-ros2 \
            -R 'bridge_ros2_(integration_test|full_process_smoke)' \
            --output-on-failure
