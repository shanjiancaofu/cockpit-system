system:
  name: cockpit-system
  vehicle_id: car_001

paths:
  data_dir: /cockpit-system/data
  log_dir: /cockpit-system/logs
  run_dir: /cockpit-system/run

logging:
  level: info
  dump_time_secs: 5
  cut_off_time_mins: 5
  max_files: 10
  mirror_stderr: true

services:
  vehicle_data:
    source: socketcan
    publish_interval_ms: 200
    grpc:
      listen_address: unix:/cockpit-system/run/vehicle-data.grpc.sock
  gateway:
    vehicle_data_address: unix:/cockpit-system/run/vehicle-data.grpc.sock
    stream_timeout_ms: 10000
    retry_delay_ms: 200
    grpc:
      listen_address: unix:/cockpit-system/run/gateway.grpc.sock
  audio:
    auto_start: false
    grpc:
      listen_address: unix:/cockpit-system/run/audio.grpc.sock
  camera:
    capture_backend: gstreamer
    preview_stale_timeout_ms: 2000
    synthetic_fault: none
    synthetic_fault_after_frames: 30
    shared_memory_name: /cockpit_camera_preview
    max_frame_bytes: 8388608
    photo_directory: photos
    photo_jpeg_quality: 90
    photo_max_frame_age_ms: 2000
    grpc:
      listen_address: unix:/cockpit-system/run/camera.grpc.sock
  voice_interaction:
    audio_address: unix:/cockpit-system/run/audio.grpc.sock
    gateway_address: unix:/cockpit-system/run/gateway.grpc.sock
    stream_timeout_ms: 10000
    retry_delay_ms: 200
    grpc:
      listen_address: unix:/cockpit-system/run/voice.grpc.sock
  recording:
    auto_start: false
    directory: recordings
    vehicle_data_address: unix:/cockpit-system/run/vehicle-data.grpc.sock
    stream_timeout_ms: 10000
    retry_delay_ms: 200
    max_sessions: 100
    max_total_bytes: 5368709120
    max_session_bytes: 1073741824
    max_session_duration_seconds: 14400
    min_free_bytes: 536870912
    grpc:
      listen_address: unix:/cockpit-system/run/recording.grpc.sock

hardware:
  can:
    interface: can0
    simulator_backend: socketcan
    simulator_interval_ms: 100
    receive_timeout_ms: 500
    max_idle_timeouts: 10
  audio:
    input_device: default
    output_device: default
    sample_rate_hz: 16000
    channels: 1
    frame_ms: 20

features:
  voice:
    enabled: false
    kws:
      enabled: false
      provider: sherpa
      cooldown_ms: 1500
      wake_word: ""
      keywords_file: /cockpit-system/ai/config/kws-keywords.txt
      model_dir: /cockpit-system/ai/models/kws/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
    vad:
      provider: mock
    speech_segment:
      pre_roll_ms: 100
      max_segment_ms: 15000
    asr:
      provider: mock
    tts:
      provider: mock
      speaker_id: 3
      speed: 1.0
  ai:
    asr_timeout_ms: 3000
    assistant_timeout_ms: 10000
    command_execution_timeout_ms: 3000
    tts_synthesis_timeout_ms: 5000
    follow_up_window_ms: 8000
    local_llm:
      enabled: false
      provider: disabled
      manage_process: false
      executable: /cockpit-system/ai/runtime/llama.cpp/current/bin/llama-server
      model_path: /cockpit-system/ai/models/llm/qwen3.5-2b-q4_k_m/model.gguf
      host: 127.0.0.1
      port: 8080
      path: /v1/chat/completions
      model: Qwen3.5-2B
      system_prompt: "You are a cockpit assistant."
      max_tokens: 128
      temperature: 0.2
      first_token_timeout_ms: 5000
      response_timeout_ms: 30000
      context_size: 2048
      gpu_layers: 0
      startup_timeout_ms: 60000

tools:
  topic:
    backend: file
    dir: /cockpit-system/logs/topics
