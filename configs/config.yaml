system:
  name: cockpit-system
  vehicle_id: car_001

paths:
  data_dir: data
  log_dir: logs

logging:
  level: info
  max_bytes: 2097152
  mirror_stderr: true

services:
  vehicle_data:
    source: mock
    publish_interval_ms: 200
    grpc:
      listen_address: 127.0.0.1:50050
  gateway:
    vehicle_data_address: 127.0.0.1:50050
    stream_timeout_ms: 10000
    retry_delay_ms: 200
    grpc:
      listen_address: 127.0.0.1:50051
    websocket:
      listen_address: 127.0.0.1:18080
  audio:
    auto_start: false
    grpc:
      listen_address: 127.0.0.1:50052
    vad:
      enabled: true
      backend: energy
      speech_threshold_dbfs: -40.0
      speech_start_frames: 3
      speech_end_frames: 10
    speech_segment:
      pre_roll_ms: 100
      max_segment_ms: 15000
  camera:
    frame_transport: shared_memory
    shared_memory_name: /cockpit_camera_preview
    max_frame_bytes: 8388608
    grpc:
      listen_address: 127.0.0.1:50054
  voice_interaction:
    audio_address: 127.0.0.1:50052
    gateway_address: 127.0.0.1:50051
    stream_timeout_ms: 10000
    retry_delay_ms: 200
    grpc:
      listen_address: 127.0.0.1:50053
  cloud_uplink:
    enabled: false
    mqtt:
      broker: tcp://127.0.0.1:1883
      telemetry_topic: vehicle/status
      qos: 1
  recording:
    auto_start: false
    directory: recordings
    vehicle_data_address: 127.0.0.1:50050
    stream_timeout_ms: 10000
    retry_delay_ms: 200
    grpc:
      listen_address: 127.0.0.1:50055

hardware:
  can:
    interface: vcan0
    simulator_backend: stdout
    simulator_interval_ms: 100
    receive_timeout_ms: 500
    max_idle_timeouts: 10
  audio:
    capture_backend: alsa
    playback_backend: alsa
    input_device: default
    output_device: default
    sample_rate_hz: 16000
    channels: 1
    frame_ms: 20

features:
  voice:
    enabled: false
    mode: push_to_talk
    asr_provider: mock
    asr_model_path: ""
    asr_language: zh
    asr_threads: 4
    tts_provider: mock
  ai:
    provider: mock
    model: local-demo
    request_timeout_ms: 10000

tools:
  topic:
    backend: file
    dir: logs/topics
