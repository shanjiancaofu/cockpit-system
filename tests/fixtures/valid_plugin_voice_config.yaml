services:
  audio:
    vad:
      provider: plugin
      plugin_path: /usr/lib/cockpit/speech/libcockpit-speech-sherpa.so
      plugin_config_path: /etc/cockpit/speech.yaml

features:
  voice:
    enabled: true
    asr:
      provider: plugin
      plugin_path: /usr/lib/cockpit/asr/libcockpit-asr.so
      plugin_config_path: /etc/cockpit/asr.yaml
