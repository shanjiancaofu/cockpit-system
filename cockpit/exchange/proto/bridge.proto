syntax = "proto3";

package cockpit.proto.bridge;

import "common.proto";

enum NavigationState {
  NAVIGATION_STATE_UNSPECIFIED = 0;
  NAVIGATION_STATE_DISABLED = 1;
  NAVIGATION_STATE_IDLE = 2;
  NAVIGATION_STATE_ACCEPTED = 3;
  NAVIGATION_STATE_EXECUTING = 4;
  NAVIGATION_STATE_SUCCEEDED = 5;
  NAVIGATION_STATE_CANCELLED = 6;
  NAVIGATION_STATE_REJECTED = 7;
  NAVIGATION_STATE_FAILED = 8;
  NAVIGATION_STATE_TIMED_OUT = 9;
  NAVIGATION_STATE_DISCONNECTED = 10;
}

message NavigationPose {
  double x_m = 1;
  double y_m = 2;
  double yaw_rad = 3;
  string frame_id = 4;
  int64 timestamp_ms = 5;
}

message SubmitNavigationGoalRequest {
  string goal_id = 1;
  NavigationPose target = 2;
}

message CancelNavigationGoalRequest {
  string goal_id = 1;
}

message NavigationStatus {
  NavigationState state = 1;
  string goal_id = 2;
  NavigationPose target = 3;
  NavigationPose current_pose = 4;
  int64 accepted_at_ms = 5;
  int64 updated_at_ms = 6;
  string message = 7;
  string last_error = 8;
  bool current_pose_valid = 9;
  cockpit.proto.common.ServiceHealth health = 100;
}

service BridgeControl {
  rpc SubmitNavigationGoal(SubmitNavigationGoalRequest) returns (NavigationStatus);
  rpc CancelNavigationGoal(CancelNavigationGoalRequest) returns (NavigationStatus);
  rpc GetNavigationStatus(cockpit.proto.common.Empty) returns (NavigationStatus);
}
