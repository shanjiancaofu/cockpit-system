syntax = "proto3";

package cockpit.proto.vehicle;

import "common.proto";

message VehicleState {
  int64 timestamp_ms = 1;
  double speed_kph = 2;
  int32 gear = 3;
  int32 soc_percent = 4;
  bool cloud_enabled = 5;
  string source = 6;
}

enum ChassisHeartbeatState {
  CHASSIS_HEARTBEAT_STATE_UNSPECIFIED = 0;
  CHASSIS_HEARTBEAT_STATE_UNKNOWN = 1;
  CHASSIS_HEARTBEAT_STATE_ALIVE = 2;
  CHASSIS_HEARTBEAT_STATE_TIMEOUT = 3;
}

message ChassisState {
  int64 timestamp_ms = 1;
  string source = 2;
  bool motion_valid = 3;
  bool running = 4;
  uint32 control_state = 5;
  sint32 left_velocity_mm_s = 6;
  sint32 right_velocity_mm_s = 7;
  sint32 linear_velocity_mm_s = 8;
  sint32 angular_velocity_mrad_s = 9;
  sint32 left_output_permille = 10;
  sint32 right_output_permille = 11;
  bool odometry_valid = 12;
  uint32 odometry_timestamp_ms = 13;
  sint32 x_mm = 14;
  sint32 y_mm = 15;
  sint32 heading_mrad = 16;
  ChassisHeartbeatState heartbeat_state = 17;
  int64 heartbeat_age_ms = 18;
  uint32 node_state = 19;
  uint32 uptime_ms = 20;
  uint32 fault_summary = 21;
  uint32 fault_severity = 22;
  uint32 active_faults = 23;
  uint32 latched_faults = 24;
  uint32 fault_sequence = 25;
  uint64 peer_reboot_count = 26;
}

message SensorState {
  int64 timestamp_ms = 1;
  double cabin_temperature_c = 2;
  double humidity_percent = 3;
  double imu_yaw_deg = 4;
}

enum ChassisEventType {
  CHASSIS_EVENT_TYPE_UNSPECIFIED = 0;
  CHASSIS_EVENT_TYPE_MOTION_DETECTED = 1;
}

message MotionSensorEvent {
  uint32 sensor_id = 1;
  bool detected = 2;
}

message ChassisEvent {
  uint64 sequence = 1;
  int64 timestamp_ms = 2;
  ChassisEventType type = 3;
  string source = 4;
  oneof payload {
    MotionSensorEvent motion = 10;
  }
}

service VehicleDataService {
  rpc SubscribeVehicleState(SubscribeVehicleStateRequest) returns (stream VehicleState);
  rpc SubscribeChassisState(SubscribeChassisStateRequest) returns (stream ChassisState);
  rpc SubscribeChassisEvents(SubscribeChassisEventsRequest) returns (stream ChassisEvent);
  rpc GetStatus(cockpit.proto.common.Empty) returns (CanLinkStatus);
}

message SubscribeVehicleStateRequest {
  string consumer = 1;
  int32 max_hz = 2;
}

message SubscribeChassisStateRequest {
  string consumer = 1;
  int32 max_hz = 2;
}

message SubscribeChassisEventsRequest {
  string consumer = 1;
}

enum CanCommunicationState {
  CAN_COMMUNICATION_STATE_UNSPECIFIED = 0;
  CAN_COMMUNICATION_STATE_STARTING = 1;
  CAN_COMMUNICATION_STATE_ONLINE = 2;
  CAN_COMMUNICATION_STATE_IDLE = 3;
  CAN_COMMUNICATION_STATE_FAULTED = 4;
}

message CanLinkStatus {
  cockpit.proto.common.ServiceHealth health = 1;
  string interface_name = 2;
  bool fd_enabled = 3;
  CanCommunicationState state = 4;
  uint64 last_rx_age_ms = 5;
  uint64 rx_frames = 6;
  uint64 decoded_frames = 7;
  uint64 invalid_frames = 8;
  uint64 idle_timeouts = 9;
  uint64 error_frames = 10;
  uint64 bus_off_count = 11;
  uint64 error_passive_count = 12;
  uint64 error_warning_count = 13;
  uint64 ack_error_count = 14;
  uint64 protocol_error_count = 15;
  string last_error = 16;
  uint64 chassis_events = 17;
  uint64 dropped_chassis_events = 18;
}
