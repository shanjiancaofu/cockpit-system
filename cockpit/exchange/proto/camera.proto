syntax = "proto3";

package cockpit.proto.camera;

import "common.proto";

enum CameraPreviewState {
  CAMERA_PREVIEW_STATE_UNSPECIFIED = 0;
  CAMERA_PREVIEW_STATE_STOPPED = 1;
  CAMERA_PREVIEW_STATE_RUNNING = 2;
  CAMERA_PREVIEW_STATE_FAULTED = 3;
  CAMERA_PREVIEW_STATE_RECOVERING = 4;
}

message CameraDevice {
  string path = 1;
  string driver = 2;
  string card = 3;
  string bus_info = 4;
  bool query_ok = 5;
  bool supports_capture = 6;
  bool supports_streaming = 7;
  string error = 8;
}

message ListCameraDevicesResponse {
  repeated CameraDevice devices = 1;
}

message StartPreviewRequest {
  string device = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 fps = 4;
}

message CameraStatus {
  CameraPreviewState state = 1;
  string device = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 fps = 5;
  uint64 frames_received = 6;
  uint64 frames_dropped = 7;
  string last_error = 8;
  repeated cockpit.proto.common.RuntimeModuleStatus modules = 9;
  uint64 source_frames_skipped = 10;
  uint64 last_frame_sequence = 11;
  uint64 last_frame_timestamp_ms = 12;
  uint64 last_frame_received_at_ms = 13;
  uint64 preview_started_at_ms = 14;
  uint64 consecutive_frame_drops = 15;
  uint64 max_consecutive_frame_drops = 16;
  uint64 consecutive_source_gaps = 17;
  uint64 max_consecutive_source_gaps = 18;
  string last_error_kind = 19;
  uint64 restart_count = 20;
  uint64 recover_count = 21;
  uint64 last_recover_at_ms = 22;
  cockpit.proto.common.ServiceHealth health = 100;
}

message TakePhotoRequest {
  string filename = 1;
}

message TakePhotoResponse {
  string path = 1;
  uint64 frame_sequence = 2;
  uint64 frame_timestamp_ms = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint64 size_bytes = 6;
}

message CameraTuningRequest {
  uint64 session_id = 1;
  uint32 revision = 2;
  string profile_yaml = 3;
}

message CameraTuningMetadata {
  bool valid = 1;
  uint32 revision = 2;
  uint64 exposure_ns = 3;
  float sensor_gain = 4;
  float isp_gain = 5;
  repeated float wb_gains = 6;
  string ae_mode = 7;
  string awb_mode = 8;
  bool ae_locked = 9;
  bool awb_locked = 10;
  uint32 awb_cct = 11;
}

message CameraTuningResponse {
  // The SDK accepted the request. This does not imply that a captured frame has used it.
  bool accepted = 1;
  uint64 session_id = 2;
  uint32 revision = 3;
  string profile_yaml = 4;
  string error = 5;
  CameraStatus status = 6;
  // True only when metadata from this session contains the requested revision.
  bool applied = 7;
  CameraTuningMetadata last_observed = 8;
}

service CameraControl {
  rpc ListDevices(cockpit.proto.common.Empty)
      returns (ListCameraDevicesResponse);
  rpc StartPreview(StartPreviewRequest) returns (CameraStatus);
  rpc StopPreview(cockpit.proto.common.Empty) returns (CameraStatus);
  rpc GetStatus(cockpit.proto.common.Empty) returns (CameraStatus);
  rpc TakePhoto(TakePhotoRequest) returns (TakePhotoResponse);
  rpc GetTuning(cockpit.proto.common.Empty) returns (CameraTuningResponse);
  rpc SetTuning(CameraTuningRequest) returns (CameraTuningResponse);
  rpc ResetTuning(CameraTuningRequest) returns (CameraTuningResponse);
  rpc ApplyTuningProfile(CameraTuningRequest) returns (CameraTuningResponse);
}
