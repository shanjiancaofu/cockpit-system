syntax = "proto3";

package cockpit.proto.sentinel;

import "common.proto";

enum SentinelState {
  SENTINEL_STATE_UNSPECIFIED = 0;
  SENTINEL_STATE_DISABLED = 1;
  SENTINEL_STATE_ARMED = 2;
  SENTINEL_STATE_TRIGGERED = 3;
  SENTINEL_STATE_COOLDOWN = 4;
  SENTINEL_STATE_FAULTED = 5;
}

message SentinelStatus {
  SentinelState state = 1;
  int64 cooldown_until_ms = 2;
  uint64 last_event_sequence = 3;
  int64 last_event_timestamp_ms = 4;
  string last_snapshot_path = 5;
  uint64 accepted_events = 6;
  uint64 suppressed_events = 7;
  uint64 failed_events = 8;
  uint64 dropped_events = 9;
  string last_error = 10;
  cockpit.proto.common.ServiceHealth health = 100;
}

service SentinelControl {
  rpc Arm(cockpit.proto.common.Empty) returns (SentinelStatus);
  rpc Disarm(cockpit.proto.common.Empty) returns (SentinelStatus);
  rpc GetStatus(cockpit.proto.common.Empty) returns (SentinelStatus);
}
