syntax = "proto3";

package cockpit.proto.voice;

import "common.proto";

enum InteractionState {
  INTERACTION_STATE_UNSPECIFIED = 0;
  INTERACTION_STATE_DISABLED = 1;
  INTERACTION_STATE_LISTENING = 2;
  INTERACTION_STATE_PROCESSING = 3;
  INTERACTION_STATE_FAULTED = 4;
}

message VoiceResponseEvent {
  uint64 id = 1;
  uint64 timestamp_ms = 2;
  uint64 transcript_id = 3;
  string transcript_text = 4;
  string intent = 5;
  string action = 6;
  string response_text = 7;
  string action_status = 8;
  string action_message = 9;
}

message VoiceMetrics {
  uint64 transcripts_received = 1;
  uint64 responses_published = 2;
  uint64 unknown_intents = 3;
  uint64 processing_errors = 4;
  uint64 upstream_reconnects = 5;
  uint64 actions_attempted = 6;
  uint64 actions_succeeded = 7;
  uint64 actions_failed = 8;
  uint64 speech_requests_accepted = 9;
  uint64 speech_requests_failed = 10;
  uint64 speech_requests_dropped = 11;
  uint64 transcript_events_dropped = 12;
  bool audio_playback_available = 13;
  uint64 audio_playback_reconnects = 14;
  uint64 audio_playback_consecutive_failures = 15;
  uint64 audio_playback_last_success_timestamp_ms = 16;
  uint64 requests_interrupted = 17;
  uint64 provider_timeouts = 18;
  uint64 provider_failures = 19;
}

message VoiceInteractionStatus {
  InteractionState state = 1;
  VoiceMetrics metrics = 2;
  VoiceResponseEvent latest_response = 3;
  string last_error = 4;
  cockpit.proto.common.ServiceHealth health = 100;
}

message ProcessTranscriptRequest {
  string text = 1;
}

message InterruptVoiceResponse {
  bool active_request_interrupted = 1;
  uint64 queued_transcripts_discarded = 2;
}

message SubscribeVoiceResponsesRequest {
  string client_id = 1;
  uint64 after_id = 2;
  uint32 max_events = 3;
}

message SubscribeTranscriptsRequest {
  string client_id = 1;
  uint64 after_id = 2;
  uint32 max_events = 3;
}

message TranscriptEvent {
  uint64 id = 1;
  uint64 timestamp_ms = 2;
  uint64 start_sequence = 3;
  uint64 end_sequence = 4;
  uint64 duration_ms = 5;
  bool truncated = 6;
  bool discontinuous = 7;
  string text = 8;
  string provider = 9;
  float confidence = 10;
}

service VoiceInteractionControl {
  rpc GetStatus(cockpit.proto.common.Empty) returns (VoiceInteractionStatus);
  rpc ProcessTranscript(ProcessTranscriptRequest) returns (VoiceResponseEvent);
  rpc Interrupt(cockpit.proto.common.Empty) returns (InterruptVoiceResponse);
  rpc SubscribeResponses(SubscribeVoiceResponsesRequest)
      returns (stream VoiceResponseEvent);
  rpc SubscribeTranscripts(SubscribeTranscriptsRequest)
      returns (stream TranscriptEvent);
}
