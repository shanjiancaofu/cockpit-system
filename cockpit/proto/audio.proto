syntax = "proto3";

package cockpit.proto.audio;

import "common.proto";

enum CaptureState {
  CAPTURE_STATE_UNSPECIFIED = 0;
  CAPTURE_STATE_STOPPED = 1;
  CAPTURE_STATE_STARTING = 2;
  CAPTURE_STATE_RUNNING = 3;
  CAPTURE_STATE_RECOVERING = 4;
  CAPTURE_STATE_FAULTED = 5;
}

message StartCaptureRequest {
  string input_device = 1;
}

message PlayPcmRequest {
  uint32 sample_rate_hz = 1;
  uint32 channels = 2;
  bytes samples_s16le = 3;
  uint64 playback_id = 4;
}

message PlayPcmResponse {
  bool accepted = 1;
  uint64 playback_id = 2;
}

enum PlaybackStatus {
  PLAYBACK_STATUS_UNSPECIFIED = 0;
  PLAYBACK_STATUS_PENDING = 1;
  PLAYBACK_STATUS_COMPLETED = 2;
  PLAYBACK_STATUS_FAILED = 3;
  PLAYBACK_STATUS_CANCELLED = 4;
  PLAYBACK_STATUS_DROPPED = 5;
  PLAYBACK_STATUS_NOT_FOUND = 6;
}

message PlaybackRequest {
  uint64 playback_id = 1;
  uint32 wait_timeout_ms = 2;
}

message PlaybackResult {
  uint64 playback_id = 1;
  PlaybackStatus status = 2;
  string error = 3;
}

message CancelPlaybackRequest {
  uint64 playback_id = 1;
}

message CancelPlaybackResponse {
  bool accepted = 1;
}

message AudioMetrics {
  uint64 pcm_frames_read = 1;
  uint64 audio_frames_published = 2;
  uint64 audio_frames_dropped = 3;
  uint64 timeouts = 4;
  uint64 xruns = 5;
  uint64 device_errors = 6;
  uint64 stream_clients_accepted = 7;
  uint64 stream_frames_queued = 8;
  uint64 stream_frames_sent = 9;
  uint64 stream_frames_dropped = 10;
  uint64 stream_client_disconnects = 11;
  uint64 playback_queued = 12;
  uint64 playback_played = 13;
  uint64 playback_failed = 14;
  uint64 playback_dropped = 15;
}

message AudioStatus {
  CaptureState capture_state = 1;
  string input_device = 2;
  uint32 sample_rate_hz = 3;
  uint32 channels = 4;
  uint32 frame_ms = 5;
  AudioMetrics metrics = 6;
  string last_error = 7;
  double input_level_dbfs = 8;
  repeated cockpit.proto.common.RuntimeModuleStatus modules = 9;
  cockpit.proto.common.ServiceHealth health = 100;
}

service AudioControl {
  rpc StartCapture(StartCaptureRequest) returns (AudioStatus);
  rpc StopCapture(cockpit.proto.common.Empty) returns (AudioStatus);
  rpc GetStatus(cockpit.proto.common.Empty) returns (AudioStatus);
  rpc PlayPcm(PlayPcmRequest) returns (PlayPcmResponse);
  rpc WaitPlayback(PlaybackRequest) returns (PlaybackResult);
  rpc CancelPlayback(CancelPlaybackRequest) returns (CancelPlaybackResponse);
}
