syntax = "proto3";

package cockpit.proto.recording;

import "common.proto";

enum RecordingState {
  RECORDING_STATE_UNSPECIFIED = 0;
  RECORDING_STATE_IDLE = 1;
  RECORDING_STATE_RECORDING = 2;
  RECORDING_STATE_FAULTED = 3;
}

message StartRecordingRequest {
  string trigger = 1;
}

message AppendRecordingEventRequest {
  int64 timestamp_ms = 1;
  string topic = 2;
  string payload_json = 3;
}

message AppendRecordingDataFileRequest {
  int64 timestamp_ms = 1;
  string source = 2;
  string kind = 3;
  string path = 4;
  uint64 size_bytes = 5;
  string checksum = 6;
}

message RecordingStatus {
  RecordingState state = 1;
  string session_id = 2;
  string directory = 3;
  string trigger = 4;
  uint64 messages_written = 5;
  int64 started_at_ms = 6;
  int64 stopped_at_ms = 7;
  int64 first_message_timestamp_ms = 8;
  int64 last_message_timestamp_ms = 9;
  string last_error = 10;
  uint64 stored_sessions = 11;
  uint64 stored_bytes = 12;
  uint64 data_files_indexed = 13;
  cockpit.proto.common.ServiceHealth health = 100;
}

message RecordingSessionInfo {
  string session_id = 1;
  string state = 2;
  string trigger = 3;
  string directory = 4;
  uint64 messages_written = 5;
  uint64 size_bytes = 6;
  int64 started_at_ms = 7;
  int64 stopped_at_ms = 8;
  uint64 data_files_indexed = 9;
}

message RecordingSessionDetail {
  RecordingSessionInfo info = 1;
  string project = 2;
  string schema_version = 3;
  string vehicle_id = 4;
  string config_path = 5;
  string config_checksum = 6;
  string git_commit = 7;
  bool git_dirty = 8;
  string build_type = 9;
  string binary_version = 10;
  repeated string sources = 11;
  int64 first_message_timestamp_ms = 12;
  int64 last_message_timestamp_ms = 13;
  uint64 data_files_indexed = 14;
}

message ListRecordingsRequest {
  uint32 limit = 1;
}

message ListRecordingsResponse {
  repeated RecordingSessionInfo sessions = 1;
  uint64 total_sessions = 2;
  uint64 total_bytes = 3;
}

message DeleteRecordingRequest {
  string session_id = 1;
}

message GetRecordingDetailRequest {
  string session_id = 1;
}

message PruneRecordingsResponse {
  uint64 sessions_deleted = 1;
  uint64 bytes_deleted = 2;
  uint64 sessions_remaining = 3;
  uint64 bytes_remaining = 4;
}

service RecordingControl {
  rpc Start(StartRecordingRequest) returns (RecordingStatus);
  rpc Stop(cockpit.proto.common.Empty) returns (RecordingStatus);
  rpc AppendEvent(AppendRecordingEventRequest) returns (RecordingStatus);
  rpc AppendDataFile(AppendRecordingDataFileRequest) returns (RecordingStatus);
  rpc GetStatus(cockpit.proto.common.Empty) returns (RecordingStatus);
  rpc List(ListRecordingsRequest) returns (ListRecordingsResponse);
  rpc GetDetail(GetRecordingDetailRequest) returns (RecordingSessionDetail);
  rpc Delete(DeleteRecordingRequest) returns (cockpit.proto.common.Empty);
  rpc Prune(cockpit.proto.common.Empty) returns (PruneRecordingsResponse);
}
