syntax = "proto3";

package cockpit.proto.gateway;

import "common.proto";
import "vehicle_state.proto";

message CockpitEvent {
  int64 timestamp_ms = 1;
  oneof payload {
    cockpit.proto.vehicle.VehicleState vehicle_state = 2;
    cockpit.proto.common.Error error = 10;
  }
}

message SubscribeCockpitEventsRequest {
  string client_id = 1;
  int32 max_hz = 2;
}

message TopicMetadata {
  string name = 1;
  string message_type = 2;
  string source = 3;
  bool subscribable = 4;
  bool publishable = 5;
}

message ListTopicsRequest {
  string client_id = 1;
}

message ListTopicsResponse {
  repeated TopicMetadata topics = 1;
}

message GetTopicInfoRequest {
  string client_id = 1;
  string topic = 2;
}

message GatewayStatus {
  cockpit.proto.common.ServiceHealth health = 1;
  bool vehicle_state_available = 2;
  int64 last_vehicle_state_age_ms = 3;
  uint64 events_published = 4;
}

service CockpitGateway {
  rpc GetStatus(cockpit.proto.common.Empty) returns (GatewayStatus);
  rpc GetLatestVehicleState(cockpit.proto.common.Empty)
      returns (cockpit.proto.vehicle.VehicleState);
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  rpc GetTopicInfo(GetTopicInfoRequest) returns (TopicMetadata);
  rpc SubscribeCockpitEvents(SubscribeCockpitEventsRequest) returns (stream CockpitEvent);
}
