syntax = "proto3";

package cockpit.proto.common;

message Error {
  int32 code = 1;
  string message = 2;
}

enum RuntimeModuleState {
  RUNTIME_MODULE_STATE_UNSPECIFIED = 0;
  RUNTIME_MODULE_STATE_CREATED = 1;
  RUNTIME_MODULE_STATE_STARTING = 2;
  RUNTIME_MODULE_STATE_RUNNING = 3;
  RUNTIME_MODULE_STATE_STOPPING = 4;
  RUNTIME_MODULE_STATE_STOPPED = 5;
  RUNTIME_MODULE_STATE_FAILED = 6;
}

message RuntimeModuleStatus {
  string name = 1;
  RuntimeModuleState state = 2;
}

enum ServiceHealthState {
  SERVICE_HEALTH_STATE_UNSPECIFIED = 0;
  SERVICE_HEALTH_STATE_OK = 1;
  SERVICE_HEALTH_STATE_DEGRADED = 2;
  SERVICE_HEALTH_STATE_FAULTED = 3;
}

message ServiceHealth {
  string service_name = 1;
  ServiceHealthState state = 2;
  string message = 3;
  string last_error = 4;
  int64 checked_at_ms = 5;
}

message Empty {
}
