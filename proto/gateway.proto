syntax = "proto3";

package cockpit.proto.gateway;

import "common.proto";
import "vehicle_state.proto";

message CockpitEvent {
  int64 timestamp_ms = 1;
  oneof payload {
    cockpit.proto.vehicle.VehicleState vehicle_state = 2;
    cockpit.proto.common.Error error = 10;
  }
}

message SubscribeCockpitEventsRequest {
  string client_id = 1;
  int32 max_hz = 2;
}

service CockpitGateway {
  rpc SubscribeCockpitEvents(SubscribeCockpitEventsRequest) returns (stream CockpitEvent);
}
